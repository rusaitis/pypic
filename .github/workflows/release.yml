name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv is pinned to a full version, not a major tag: it stopped
      # publishing @vN tags at v8 to reduce supply-chain exposure.
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv build
      # Catches a malformed README or bad metadata before PyPI rejects
      # the upload, when the tag has already been pushed.
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pypic-plasma
    # Trusted Publishing (OIDC) — no API token is stored in the repo.
    # Configure the publisher at pypi.org/manage/account/publishing/
    # for project "pypic-plasma", workflow "release.yml".
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
