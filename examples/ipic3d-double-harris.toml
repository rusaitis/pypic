# iPIC3D Double Harris Sheet → simulation.toml (v1.0)
#
# How an iPIC3D input file maps to the pypic v1.0 schema. The iPIC3D
# reader generates this from native iPIC3D parameters.

[schema]
version = "2.0"
created = 2026-04-24

[model]
name        = "iPIC3D"
type        = "PIC"
description = "Double Harris sheet reconnection"

[run]
name        = "double_harris_example"
description = "Reference fixture packaged with pypic"

[time]
scheme  = "fixed"
dt      = 0.125
t_start = 0.0
t_end   = 100.0
n_steps = 800

[grid]
dimensions = [100, 100, 1]
spacing    = [0.3, 0.3, 1.0]          # Lx/nxc, Ly/nyc, Lz/nzc
lower      = [0.0, 0.0, 0.0]
upper      = [30.0, 30.0, 1.0]        # dimensions × spacing

[boundary_conditions]
lower = ["periodic", "periodic", "periodic"]
upper = ["periodic", "periodic", "periodic"]

[units]
anchor            = "from_species"     # length unit is the electron skin depth
reference_species = "electrons"        # this run is electron-normalized
reference_number_density = 1.0e18      # m⁻³ — a chosen anchor, not recoverable from the .inp

[coordinates]
geometry = "cartesian"
frame    = "simulation"

[physics]
relativistic = false

[physics.pic]
# omega_pe/omega_ce = 10 here — canonical double-Harris ratio.
omega_p_over_omega_c = 10.0

[physics.pic.solver]
scheme       = "semi-implicit"
implicitness = 0.5
pusher       = "boris"
field_solver = "implicit-moment"

[initial_conditions]
type                    = "double_harris"
B0                      = [0.097, 0.0, 0.0]
perturbation_amplitude  = 0.4
current_sheet_thickness = 0.25

[[species]]
name                = "electrons_harris"
charge              = -1.0
mass                = 0.00390625       # 1/|qom| = 1/256
particles_per_cell  = [5, 5, 1]
thermal_velocity    = [0.06, 0.02, 0.02]
drift_velocity      = [0.0, 0.0, 0.00325]
density             = 1.0

[[species]]
name                = "ions_harris"
charge              = 1.0
mass                = 1.0
particles_per_cell  = [5, 5, 1]
thermal_velocity    = [0.0063, 0.0063, 0.0063]
drift_velocity      = [0.0, 0.0, -0.01624]
density             = 1.0

[[species]]
name                = "electrons_background"
charge              = -1.0
mass                = 0.00390625
particles_per_cell  = [5, 5, 1]
thermal_velocity    = [0.06, 0.02, 0.02]
drift_velocity      = [0.0, 0.0, 0.0]
density             = 1.0

[[species]]
name                = "ions_background"
charge              = 1.0
mass                = 1.0
particles_per_cell  = [5, 5, 1]
thermal_velocity    = [0.0063, 0.0063, 0.0063]
drift_velocity      = [0.0, 0.0, 0.0]
density             = 1.0

[output.fields]
step_interval = 50
quantities    = ["B", "E", "J", "rho_c"]
dir           = "./fields"
format        = "hdf5"
precision     = "f32"
