[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name is "pypic-plasma"; the import name stays "pypic".
# The bare "pypic" is held on PyPI by an unrelated 2017 project that has
# had no release since. See [tool.hatch.build.targets.wheel] below —
# hatchling infers the package directory from this name and needs telling.
name = "pypic-plasma"
version = "0.1.3"
description = "Read, analyze, and plot plasma simulation output from PIC and MHD codes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Liutauras Rusaitis", email = "liutauras.rusaitis@gmail.com" },
]
keywords = [
    "plasma physics",
    "particle-in-cell",
    "magnetohydrodynamics",
    "simulation analysis",
    "heliophysics",
    "space physics",
]
# No "License ::" classifier — PEP 639 deprecates it in favour of the
# SPDX `license` expression above.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "xarray>=2024.6",
    "h5py>=3.11",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/rusaitis/pypic"
Documentation = "https://rusaitis.github.io/pypic/"
Repository = "https://github.com/rusaitis/pypic"
Issues = "https://github.com/rusaitis/pypic/issues"
Changelog = "https://github.com/rusaitis/pypic/blob/main/CHANGELOG.md"

[project.scripts]
# Guarded shim, not pypic.cli:app directly — the command is always
# installed but Typer only ships in the `cli` extra.
pypic = "pypic._cli_entry:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.9"]
3d = ["pyvista>=0.44"]
cli = ["typer>=0.12", "rich>=13.0"]
zarr = [
    "zarr>=3.1.0,<4",
    "numcodecs>=0.16.0",
    "virtualizarr>=2.4",
    "icechunk>=1.1",
]
icechunk = [
    "icechunk>=1.1",
    "numcodecs>=0.16.0",
    "zarr>=3.1.0,<4",
]
arrow = ["pyarrow>=17.0"]
duckdb = ["duckdb>=1.4", "pyarrow>=17.0"]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyarrow>=17.0",
    # uvicorn[standard] already requires websockets>=10.4; pinned higher
    # here because the stream endpoint relies on 13.x close-frame handling.
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-bibtex>=2.16",
    "scipy-stubs>=1.17.1.1",
    "typer>=0.12",
    "rich>=13.0",
    "jsonschema>=4.21",
    "httpx>=0.27",
]

# Bundle the generated JSON Schema(s) into the wheel so downstream
# consumers (other-language validators, MATLAB users, anyone who isn't
# running the CLI) can read it via importlib.resources without cloning
# the repo. Switch to a glob when v1.1+ ships alongside v1.0.
# The distribution is "pypic-plasma" but the package is src/pypic, so
# hatchling's name-based inference would look for src/pypic_plasma and
# fail. Point it at the real directory.
[tool.hatch.build.targets.wheel]
packages = ["src/pypic"]

[tool.hatch.build.targets.wheel.force-include]
"src/pypic/schema/simulation.schema.v1.0.json" = "pypic/schema/simulation.schema.v1.0.json"


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "SIM",            # flake8-simplify
    "TCH",            # flake8-type-checking
    "RUF",            # ruff-specific
    "D",              # pydocstyle
    "ANN",            # flake8-annotations
    "PT",             # flake8-pytest-style
    "T20",            # flake8-print — the "no print() in library code" rule
    "NPY",            # numpy-specific
    "FURB",           # refurb — modern-Python rewrites
    "LOG",            # flake8-logging
    "PERF",           # perflint
    "C4",             # flake8-comprehensions
    "PIE",            # flake8-pie
    "PTH",            # flake8-use-pathlib
    "PLW",            # pylint warnings
    "BLE",            # flake8-blind-except
    "SLF",            # flake8-self — private access across object boundaries
]
ignore = [
    "D100",  # missing module docstring
    "D104",  # missing package docstring
    "D105",  # missing docstring in magic method
]
# Physics/math characters that look like ASCII confusables but are
# intentional notation in our docstrings, comments, and tables. Curated:
# adding a character here is an explicit decision, not a blanket bypass.
allowed-confusables = [
    "×",  # multiplication sign (vs lowercase x)
    "–",  # en dash (vs hyphen-minus)
    "ρ", "μ", "ε", "π", "σ", "θ", "φ", "γ", "α", "β", "λ", "ω",  # greek letters
    "Δ", "∇",  # nabla, capital delta
    "ℓ",  # script small l (arc length, used in line integrals)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests get D (docstrings), ANN (annotations), and N (naming) leeway —
# capitalized scientific symbols (R for rotation, P/Pe/Pi for canonical
# pressure fields) are intentional in physics test names and locals.
# BLE001: the aggregated sweeps ("run every function in this family over
# an empty array and report which ones broke") catch Exception because
# the exception type is the finding, not an accident.
# SLF001: reaching into a private attribute is what a unit test is for —
# `_REGISTRY`, `_normal_arr`, `_rgba_under` are the things under test.
"tests/*" = ["D", "ANN", "N", "BLE001", "SLF001"]
# Typer evaluates each command's annotations at registration time, so
# argument and option types must exist at runtime, not only for mypy.
"src/pypic/cli/*" = ["TC001", "TC002", "TC003"]
# pyvista wraps the untyped vtk C-API; helpers must accept Any.
"src/pypic/plotting/pyvista/*" = ["ANN401"]
# The active theme and the default theme are process-wide by design —
# `use_theme()` is a context manager over matplotlib's own global rcParams,
# so the state it swaps has to live at module scope too. Threading it
# through every plotting call is the rewrite this audit rules out.
"src/pypic/plotting/styles.py" = ["PLW0603"]
# Fixture generators, benchmarks and examples are scripts: they print
# progress and are read top-to-bottom, so stdout is the point. Generators
# additionally embed fixed-width records (iPIC3D ConservedQuantities
# columns, settings.hdf lines) that must stay on one line to remain valid
# fixtures, and use capitalized physics names (meshgrid Y) like the tests.
"scripts/*" = ["T201", "E501", "N806"]
# Run-by-eye figure generators drive pyvista's widget internals directly;
# mypy already skips this directory for the same reason.
"scripts/visual/*" = ["SLF001"]
"benchmarks/*" = ["T201"]
"examples/*" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.13"
# Suppress "missing library stubs or py.typed marker" warnings — these
# don't catch real bugs and are noise for any project that depends on
# scientific packages without stubs (vtk, pyvista, mpl_toolkits, ...).
# Real "module not found" errors are separate (import-not-found).
disable_error_code = ["import-untyped"]
# scripts/visual/* are manual, run-by-eye figure generators driving
# matplotlib and pyvista interactively: linted and formatted, but not
# type-checked — strict mode on throwaway plotting code is all noise.
# examples/*/
# subdirectories are local simulation data that .gitignore already keeps
# out of the repo, but mypy (unlike ruff) does not read .gitignore.
exclude = ["^scripts/visual/", "^examples/[^/]+/"]

[[tool.mypy.overrides]]
# Untyped third-party packages — no py.typed marker upstream.
# Centralized so the day stubs land, removing the override re-enables
# checking automatically.
module = ["vtk", "vtk.*", "mpl_toolkits.*", "pyvista", "pyvista.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pypic.plotting.pyvista wraps the untyped vtk/pyvista C-API. mypy can't
# usefully check arg/call types when the third-party surface is dynamic;
# this mirrors the ANN401 ruff exemption for the same subpackage. Other
# checks (return-value, attr-defined on typed parts, missing imports of
# typed modules) still run. Revisit if pyvista ships py.typed upstream.
module = "pypic.plotting.pyvista.*"
disable_error_code = [
    "arg-type",
    "call-arg",
    "no-untyped-call",
    "assignment",
    "no-any-return",
    "attr-defined",
]


[tool.coverage.run]
source = ["pypic"]
# Doctests exercise the same modules; without this, running the suite
# twice over src/ (once as tests, once as doctests) double-counts nothing
# but branch arcs get confusing.
branch = false

[tool.coverage.report]
# Measured 2026-09-12 at 88%. Two points of slack absorbs the churn of a
# normal change; a real drop still fails. Raise it when it earns the room.
fail_under = 86
exclude_also = [
    # Type-only imports never execute at runtime.
    "if TYPE_CHECKING:",
    # The exhaustive-match guard architecture.md mandates after an enum
    # match. Reaching it means the enum grew a member, which mypy catches
    # first, so there is nothing to cover.
    "assert_never\\(",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --strict-markers -ra"
# An xfail that starts passing is a fixed bug nobody noticed, or a test
# that stopped testing. Either way it should fail.
xfail_strict = true
# Warnings are errors. A warning that reaches a user of a physics library
# usually means a silent numerical compromise (a NaN dropped, a unit
# unresolved), so the suite must not be able to grow one unnoticed.
# Every ignore below names its upstream source; there is exactly one.
filterwarnings = [
    "error",
    # zarr-python warns on every consolidated-metadata write. pypic writes
    # it deliberately — docs/schema.md § 4.2 makes consolidated metadata
    # part of the on-disk layout, and readers fall back to listing when it
    # is absent. Drop when the Zarr v3 spec absorbs it.
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification:UserWarning",
]
