# Optional developer convenience; CI gates on scripts/check.sh regardless.
#
#     uv tool install pre-commit && pre-commit install
#
# Local hooks only — no ruff-pre-commit mirror. A mirror pins its own ruff
# and would drift from the version uv.lock resolves, which is the one CI
# runs; a hook that disagrees with the gate is worse than no hook.
#
# Only lint and format: both are seconds, and both read the whole repo
# (see the single-root note in scripts/check.sh), so neither takes file
# arguments. types and test are too slow for a commit hook and belong on
# the pull request.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: scripts/check.sh lint
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: scripts/check.sh format
        language: system
        types_or: [python, pyi]
        pass_filenames: false
