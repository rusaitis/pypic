site_name: pypic
site_description: Read, analyze, and plot plasma simulation output from PIC and MHD codes.
site_url: https://rusaitis.github.io/pypic/
site_author: Liutauras Rusaitis
copyright: Copyright &copy; 2026 Liutauras Rusaitis — MIT License

# Unresolved cross-references and broken internal links are build
# failures, not warnings — set here so a local build matches CI without
# having to remember the --strict flag.
strict: true

repo_url: https://github.com/rusaitis/pypic
repo_name: rusaitis/pypic
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/pypic-icon.png
  favicon: assets/pypic-icon.png
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - toc.integrate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
  - bibtex:
      bib_file: docs/references.bib

markdown_extensions:
  - admonition
  - pymdownx.details
  - footnotes
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_javascript:
  - mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorial: tutorial.md
  - Architecture: architecture.md
  - Physics Reference:
    - Derivations: derivations.md
    - Equations: equations.md
    - Conventions: conventions.md
    - Schema: schema.md
    - Aliases (library): aliases.md
  - API Reference:
    - Command Line: api/cli.md
    - Core Containers: api/containers.md
    - Derived Quantities: api/derived.md
    - Diagnostics: api/diagnostics.md
    - Spectral Analysis: api/spectral.md
    - Reconnection: api/reconnection.md
    - Units & Normalization: api/units.md
    - Field Registry: api/fields.md
    - Compute & Recipes: api/compute.md
    - Codegen Export: api/codegen.md
    - Selections: api/selections.md
    - Reductions: api/reductions.md
    - Coordinates & Operators: api/coordinates.md
    - Regridding: api/regridding.md
    - Comparison: api/comparison.md
    - Numerics: api/numerics.md
    - Readers: api/readers.md
    - Field Line Tracing: api/traces.md
    - Poincaré Sections: api/poincare.md
    - Modern I/O: api/io.md
    - Plotting: api/plotting.md
    - Server: api/server.md
    - Schema Validation: api/schema.md
    - Exceptions: api/exceptions.md
